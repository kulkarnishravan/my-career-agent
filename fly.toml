# fly.toml app configuration file for Gradio RAG Chatbot
# Documentation: https://fly.io/docs/reference/configuration/

# Replace with your unique Fly.io app name, or let `fly launch` set it for you
app = "shravan-rag-chatbot"
primary_region = "sin"

[build]

[env]
  PORT = "7860"
  GRADIO_SERVER_NAME = "0.0.0.0"

[http_service]
  internal_port = 7860
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
